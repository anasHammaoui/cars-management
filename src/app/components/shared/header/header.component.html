<header class="bg-white border-b border-slate-200 sticky top-0 z-10">
  <div class="flex items-center justify-between px-6 py-4">
    <h2 class="text-xl font-semibold text-slate-900">Gestion des Voitures</h2>
    
    <div class="flex items-center gap-4">
      @if (isAuthenticated$ | async) {
        <span class="text-sm text-slate-600">{{ (currentUser$ | async)?.firstName }}</span>
        <button (click)="logout()" type="button" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded hover:bg-red-700 transition cursor-pointer">
          Déconnexion
        </button>
      } @else {
        <a routerLink="/login" class="inline-block px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded hover:bg-blue-700 transition cursor-pointer">
          Connexion
        </a>
      }
    </div>
  </div>
</header>
