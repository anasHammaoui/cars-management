<aside class="w-64 bg-slate-900 text-white min-h-screen fixed left-0 top-0">
  <div class="p-6">
    <h1 class="text-xl font-bold mb-8">Concession Auto</h1>
    
    <nav class="space-y-2">
      <h3 class="text-xs font-semibold text-slate-400 uppercase mb-3">Menu</h3>
      <a routerLink="/cars" routerLinkActive="bg-slate-800" class="block px-4 py-2 rounded hover:bg-slate-800 transition">
        Voitures
      </a>
    </nav>

    <div class="mt-8">
      <h3 class="text-xs font-semibold text-slate-400 uppercase mb-3">Marques</h3>
      <div class="space-y-1">
        <button 
          (click)="filterByBrand('')"
          type="button"
          [class.bg-slate-800]="!(filter$ | async)?.marque"
          class="w-full text-left px-4 py-2 rounded hover:bg-slate-800 transition text-sm cursor-pointer">
          Toutes
        </button>
        @for (brand of brands$ | async; track brand.id) {
          <button 
            (click)="filterByBrand(brand.titre)"
            type="button"
            [class.bg-slate-800]="(filter$ | async)?.marque === brand.titre"
            class="w-full text-left px-4 py-2 rounded hover:bg-slate-800 transition text-sm cursor-pointer">
            {{ brand.titre }}
          </button>
        }
      </div>
    </div>
  </div>
</aside>
