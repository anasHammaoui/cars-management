<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-8">
      <h2 class="text-2xl font-bold text-slate-900 mb-6">Connexion</h2>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Nom d'utilisateur</label>
            <input 
              type="text" 
              formControlName="username"
              placeholder="Entrez votre nom d'utilisateur" 
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
              [class.border-red-500]="username?.invalid && username?.touched"
            />
            @if (username?.invalid && username?.touched) {
              <p class="text-red-600 text-xs mt-1">Nom d'utilisateur requis</p>
            }
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Mot de passe</label>
            <input 
              type="password" 
              formControlName="password"
              placeholder="Entrez votre mot de passe" 
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
              [class.border-red-500]="password?.invalid && password?.touched"
            />
            @if (password?.invalid && password?.touched) {
              <p class="text-red-600 text-xs mt-1">Mot de passe requis (min. 6 caractères)</p>
            }
          </div>

          @if (error$ | async; as error) {
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
              {{ error }}
            </div>
          }

          <button 
            type="submit" 
            class="w-full px-4 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition disabled:opacity-50"
            [disabled]="loginForm.invalid || (loading$ | async)"
          >
            @if (loading$ | async) {
              <span class="flex items-center justify-center gap-2">
                <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Connexion...
              </span>
            } @else {
              Se connecter
            }
          </button>
        </div>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-200">
        <p class="text-sm text-slate-600 font-medium mb-2">Compte de test</p>
        <div class="bg-slate-50 rounded-lg p-3 text-xs space-y-1">
          <p><span class="font-semibold">Username:</span> emilys</p>
          <p><span class="font-semibold">Password:</span> emilyspass</p>
        </div>
      </div>
    </div>
  </div>
</div>
