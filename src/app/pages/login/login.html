<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-md w-96">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Connexion</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">
          Nom d'utilisateur
        </label>
        <input 
          type="text" 
          formControlName="username"
          placeholder="Entrez votre nom d'utilisateur" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          [class.border-red-500]="username?.invalid && username?.touched"
        />
        @if (username?.invalid && username?.touched) {
          <p class="text-red-500 text-xs mt-1">
            Nom d'utilisateur requis
          </p>
        }
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">
          Mot de passe
        </label>
        <input 
          type="password" 
          formControlName="password"
          placeholder="Entrez votre mot de passe" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          [class.border-red-500]="password?.invalid && password?.touched"
        />
        @if (password?.invalid && password?.touched) {
          <p class="text-red-500 text-xs mt-1">
            Mot de passe requis (min. 6 caractères)
          </p>
        }
      </div>

      @if (error$ | async; as error) {
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
          <span>{{ error }}</span>
        </div>
      }

      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline disabled:opacity-50"
        [disabled]="loginForm.invalid || (loading$ | async)"
      >
        @if (loading$ | async) {
          <span class="inline-block animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></span>
          <span>Connexion...</span>
        } @else {
          <span>Se connecter</span>
        }
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-gray-200">
      <div class="text-sm text-center text-gray-600">
        <p class="font-semibold mb-1">Compte de test :</p>
        <p>Username: <strong>emilys</strong></p>
        <p>Password: <strong>emilyspass</strong></p>
      </div>
    </div>
  </div>
</div>
